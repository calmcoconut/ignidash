# Single-container Ignidash: the Convex backend and the Next.js app run as two
# supervised processes inside one image. See PLAN-single-container-offline.md.
#
# Host defaults assume the existing LAN setup: app on 3030, Convex API on 3210,
# Convex HTTP actions on 3211. The browser dials 3210 directly, so it stays
# published.
services:
  ignidash:
    image: ghcr.io/calmcoconut/ignidash:${IGNIDASH_TAG:-latest}
    build:
      context: .
      args:
        # Pinned in the Dockerfile; only override to upgrade on purpose.
        NEXT_PUBLIC_CONVEX_URL: >-
          ${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
        NEXT_PUBLIC_CONVEX_SITE_URL: >-
          ${NEXT_PUBLIC_CONVEX_SITE_URL:-http://localhost:3211}
        # Build-time only: Next inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: >-
          ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3030}:3000'
      - '${CONVEX_PORT:-3210}:3210'
      - '${CONVEX_SITE_PORT:-3211}:3211'
    volumes:
      # SQLite database, file storage and the instance credentials live here.
      # Nothing else in the container is stateful.
      - convex-data:/convex/data
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Server-side traffic never leaves the container.
      - SELF_HOSTED_CONVEX_URL=http://127.0.0.1:3210
      - SELF_HOSTED_CONVEX_SITE_URL=http://127.0.0.1:3211
      # Advertised to the browser. Must be reachable from client machines.
      - CONVEX_CLOUD_ORIGIN=${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
      - CONVEX_SITE_ORIGIN=${NEXT_PUBLIC_CONVEX_SITE_URL:-http://localhost:3211}
      - SITE_URL=${SITE_URL:-http://localhost:3030}
      # Opt out of the backend's hourly telemetry beacon.
      - DISABLE_BEACON=true
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      # Both processes must be healthy; the app alone can serve a dead backend.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:3210/version >/dev/null &&
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_signal: SIGTERM
    stop_grace_period: 30s

volumes:
  convex-data:
