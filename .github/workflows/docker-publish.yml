name: Docker Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip image tests after build'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SELF_HOSTED=true
            NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
            NEXT_PUBLIC_CONVEX_SITE_URL=http://localhost:3211
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Push to main: latest + sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            # Tags/releases: stable + semver versions
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Fallback for workflow_dispatch on non-main branches
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Ignidash
            org.opencontainers.image.description=Self-hosted Ignidash application
            org.opencontainers.image.vendor=SchelskeDevCo

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  test:
    runs-on: ubuntu-latest
    needs: merge
    if: ${{ !inputs.skip_tests }}
    permissions:
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test amd64 image
        env:
          # Passed through env instead of interpolated into the script: a branch
          # or tag name may contain characters a shell would interpret.
          REF: ${{ github.ref }}
          IS_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Testing amd64 image..."
          if [[ "$IS_VERSION_TAG" == "true" ]]; then
            TAG="stable"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            TAG="latest"
          else
            TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "Using tag: $TAG"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"
          # The merged image must carry all three payloads: the app's Node
          # runtime, the Convex backend binary, and the supervisor entrypoint.
          docker run --rm --platform linux/amd64 --entrypoint node "$IMAGE" --version
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/bash "$IMAGE" -c \
            'set -e; test -x /convex/convex-local-backend; test -x /convex/run_backend.sh; \
             test -x /usr/local/bin/docker-entrypoint.sh; test -x /usr/bin/tini; \
             test -f /app/server.js; echo "layout ok"'
          echo "Image test passed"

          # A0: the checks above only prove files exist. Boot the image and
          # prove the supervisor actually brings both processes up — that is
          # the part nothing else exercises until a real deployment.
          echo "Booting the container..."
          CID=$(docker run -d --platform linux/amd64 -e SELF_HOSTED=true "$IMAGE")
          READY=0
          for i in $(seq 1 60); do
            if ! docker inspect -f '{{.State.Running}}' "$CID" | grep -q true; then
              echo "::error::container exited during boot"
              docker logs "$CID"
              docker rm -f "$CID"
              exit 1
            fi
            if docker exec "$CID" curl -fsS --max-time 2 http://127.0.0.1:3210/version >/dev/null 2>&1; then
              READY=1
              echo "Convex backend answered /version after ${i}s"
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Convex backend never answered /version within 60s"
            docker logs "$CID"
            docker rm -f "$CID"
            exit 1
          fi

          APP_READY=0
          for i in $(seq 1 30); do
            if docker exec "$CID" curl -fsS --max-time 2 http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              APP_READY=1
              echo "Next.js app answered /api/health after ${i}s"
              break
            fi
            sleep 1
          done

          docker logs "$CID"
          docker rm -f "$CID"

          if [[ "$APP_READY" != "1" ]]; then
            echo "::error::Next.js app never answered /api/health within 30s"
            exit 1
          fi
          echo "Boot test passed"

  summary:
    runs-on: ubuntu-latest
    needs: [merge, test]
    if: always() && needs.merge.result == 'success'
    permissions:
      packages: read

    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      - name: Generate build summary
        env:
          REF: ${{ github.ref }}
          IS_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/amd64\` (native runner)" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/arm64\` (native runner)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          if [[ "$IS_VERSION_TAG" == "true" ]]; then
            TAG="stable"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            TAG="latest"
          else
            TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
